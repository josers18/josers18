name: Latest blog post workflow
on:
  schedule:
    # Runs daily at 06:00 UTC (~02:00 ET) — keeps the README fresh without spamming commits
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest analyticsmadesimple.com posts
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to full commit SHAs for supply-chain safety.
      # Bump comments alongside the SHA so the version stays auditable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pull in posts
        uses: gautamkrishnar/blog-post-workflow@2786e54a01b71aec80a5118c2bd6b5044e842597 # v1 / 1.9.6
        with:
          feed_list: "https://analyticsmadesimple.com/feed/"
          max_post_count: 5
          template: "- [$title]($url) <sub>($date)</sub>"
          date_format: "mmm dd, yyyy"
          commit_message: "chore(readme): refresh latest blog posts"
